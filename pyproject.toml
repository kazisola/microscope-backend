[project]
name = "microscope-backend"
version = "0.1.0"
description = "A search engine for the microscopic world | search everyday objects and see what they really look like under a microscope"
readme = "README.md"
authors = [
    { name = "Kazi Solayman", email = "kazisolayman123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
microscope-backend = "microscope_backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "microscope_backend.main:app"
